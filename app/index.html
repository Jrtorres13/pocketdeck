:root {
  color-scheme: dark;
  --space-3xs: 2px; --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px;
  --text-xs: 0.75rem; --text-sm: 0.875rem; --text-md: 1rem; --text-lg: 1.2rem; --text-xl: 1.44rem; --text-2xl: 1.728rem; --text-3xl: 2.074rem; --text-4xl: 3rem;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --dur-micro: 120ms; --dur-short: 220ms; --dur-long: 420ms;
  --z-raised: 10; --z-modal: 400; --z-toast: 500;
  --color-paper: oklch(13% 0.012 40); --color-paper-2: oklch(17.5% 0.016 40); --color-paper-3: oklch(22% 0.018 40); --color-paper-4: oklch(27% 0.02 40);
  --color-ink: oklch(94% 0.02 80); --color-ink-2: oklch(84% 0.025 70); --color-muted: oklch(72% 0.03 60);
  --color-rule: oklch(96% 0.01 80 / 0.12); --color-rule-strong: oklch(96% 0.01 80 / 0.24);
  --color-accent: oklch(70% 0.2 45); --color-accent-ink: oklch(14% 0.02 40); --color-focus: oklch(76% 0.19 56);
  --color-error: oklch(72% 0.15 27); --color-success: oklch(76% 0.13 150); --color-warn: oklch(84% 0.13 78);
  --heat-1: oklch(22% 0.07 22); --heat-2: oklch(40% 0.16 27); --heat-3: oklch(60% 0.21 36); --heat-4: oklch(76% 0.19 56); --heat-5: oklch(89% 0.14 78); --heat-6: oklch(98% 0.04 95);
  --scrim: oklch(6% 0.01 40 / 0.66); --key-hi: oklch(100% 0 0 / 0.07); --key-lo: oklch(4% 0.01 40 / 0.7); --shade: oklch(8% 0.01 40 / 0.72);
  --qr-light: oklch(94% 0.02 80); --qr-dark: oklch(13% 0.012 40);
  --on-light: oklch(16% 0.02 40); --on-dark: oklch(96% 0.02 80);
  /* key lights: what a user can pick for a key */
  --key-cream: oklch(92% 0.03 80); --key-ember: oklch(70% 0.2 45); --key-amber: oklch(82% 0.15 75); --key-whiteheat: oklch(96% 0.05 92);
  --key-oxblood: oklch(58% 0.19 27); --key-rose: oklch(74% 0.14 8); --key-sage: oklch(78% 0.1 150); --key-teal: oklch(76% 0.1 190);
  --key-sky: oklch(76% 0.11 235); --key-iris: oklch(72% 0.13 285); --key-stone: oklch(66% 0.025 60); --key-ash: oklch(44% 0.015 40);
  --font-display: "Gloock", "Iowan Old Style", Georgia, serif; --font-body: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; --font-outlier: ui-monospace, "Cascadia Mono", Consolas, monospace;
  --radius-card: 28px; --radius-well: 16px; --radius-pill: 999px; --rule-hair: 1px;
  --shadow-card: 0 50px 90px -30px oklch(8% 0.01 40 / 0.5);
  --tracking-display: -0.02em;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
}

  --color-ink: oklch(20% 0.02 40); --color-ink-2: oklch(30% 0.025 40); --color-muted: oklch(45% 0.03 50);
  --color-rule: oklch(20% 0.02 40 / 0.14); --color-rule-strong: oklch(20% 0.02 40 / 0.28);
  --color-accent: oklch(54% 0.17 50); --color-accent-ink: oklch(98% 0.01 80); --color-focus: oklch(54% 0.17 50);
  --key-hi: oklch(100% 0 0 / 0.9); --key-lo: oklch(40% 0.03 50 / 0.25); --scrim: oklch(25% 0.02 40 / 0.4); --shade: oklch(20% 0.02 40 / 0.6);
  --key-cream: oklch(28% 0.02 40); --key-whiteheat: oklch(60% 0.12 80); --key-amber: oklch(64% 0.15 70); --key-sage: oklch(55% 0.11 150);
  --key-teal: oklch(55% 0.1 190); --key-sky: oklch(55% 0.13 240); --key-stone: oklch(50% 0.03 60); --key-rose: oklch(58% 0.17 8);

*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

/* ---------- shell ---------- */

@media (max-width: 600px) { #connectBtn { width: 44px; padding: 0; } #connectBtn span { display: none; } }

/* ---------- the deck ---------- */

#grid { display: grid; gap: var(--gap, 12px); }

.key.imgfull .kl { position: absolute; left: 0; right: 0; bottom: 0; padding: 18% 8% 8%; background: linear-gradient(to top, var(--shade), transparent); color: var(--color-ink); }
.key:hover { background: linear-gradient(to bottom, var(--color-paper-4), var(--color-paper-3)); }
.key.solid:hover { background: var(--kc); }

.key.ok { outline: 2px solid color-mix(in oklab, var(--kc) 80%, transparent); outline-offset: 3px; }
.key.err { outline: 2px solid var(--color-error); outline-offset: 3px; animation: shake var(--dur-short) var(--ease-out); }

.key.dragging { opacity: 0.3; }
.key.drop { outline: 2px solid var(--color-focus) !important; outline-offset: 3px; }
.ghost-key { position: fixed; z-index: var(--z-toast); pointer-events: none; transform: scale(1.06); box-shadow: var(--shadow-card); }
.tabs { display: flex; gap: var(--space-2xs); justify-content: center; flex: 0 0 auto; overflow-x: auto; scrollbar-width: none; min-height: 44px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { min-height: 40px; padding: 0 var(--space-sm); border-radius: var(--radius-pill); font-size: var(--text-sm); font-weight: 500; color: var(--color-muted); white-space: nowrap; transition: background-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out); }
.tabs button:hover { color: var(--color-ink); }
.tabs button.cur { color: var(--color-ink); background: var(--color-paper-2); box-shadow: inset 0 0 0 var(--rule-hair) var(--color-rule); }
.tabs .crumb { align-self: center; font-size: var(--text-sm); color: var(--color-muted); }
.editbar { display: flex; align-items: center; gap: var(--space-sm); padding: var(--space-2xs) var(--space-2xs) var(--space-2xs) var(--space-md); border-radius: var(--radius-well); background: var(--color-paper-2); border: var(--rule-hair) solid var(--color-rule); font-size: var(--text-sm); color: var(--color-ink-2); }

/* ---------- sheets ---------- */
.scrim { display: none; position: fixed; inset: 0; z-index: var(--z-modal); background: var(--scrim); opacity: 0; transition: opacity var(--dur-short) var(--ease-out); }
.scrim.show { opacity: 1; }
.sheet { position: fixed; z-index: var(--z-modal); left: 0; right: 0; bottom: 0; max-height: 92dvh; display: flex; flex-direction: column; background: var(--color-paper-2); border-top: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card) var(--radius-card) 0 0; transform: translateY(100%); transition: transform var(--dur-long) var(--ease-out); }
.sheet.show { transform: none; }

  .sheet { left: auto; top: 0; bottom: 0; width: 460px; max-height: none; border-radius: 0; border-top: 0; border-left: var(--rule-hair) solid var(--color-rule); transform: translateX(100%); }
  .sheet.center { left: 50%; top: 50%; bottom: auto; right: auto; width: 540px; max-height: 88vh; border-radius: var(--radius-card); border: 0; box-shadow: var(--shadow-card); transform: translate(-50%, -46%); opacity: 0; transition: opacity var(--dur-short) var(--ease-out), transform var(--dur-short) var(--ease-out); }
  .sheet.center.show { transform: translate(-50%, -50%); opacity: 1; }
  .grab { display: none; }
}
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--color-rule-strong); margin: var(--space-xs) auto 0; flex: 0 0 auto; }
.sh-head { display: flex; align-items: center; gap: var(--space-xs); padding: var(--space-sm) var(--space-sm) var(--space-sm) var(--space-lg); }
.sh-head h2 { flex: 1; font-size: var(--text-2xl); }
.sh-body { overflow-y: auto; padding: var(--space-xs) var(--space-lg) calc(var(--safe-b) + var(--space-lg)); -webkit-overflow-scrolling: touch; }
.sh-foot { display: flex; align-items: center; gap: var(--space-xs); padding: var(--space-sm) var(--space-lg) calc(var(--safe-b) + var(--space-sm)); border-top: var(--rule-hair) solid var(--color-rule); }

/* ---------- forms ---------- */
.sec { padding: var(--space-md) 0; border-top: var(--rule-hair) solid var(--color-rule); }
.sec:first-child { border-top: 0; padding-top: 0; }
.sec > h3 { font-family: var(--font-body); letter-spacing: 0; font-weight: 500; font-size: var(--text-sm); color: var(--color-muted); margin-bottom: var(--space-sm); }
.field { margin-bottom: var(--space-md); }

.field > label, .lbl { display: block; font-size: var(--text-sm); font-weight: 500; color: var(--color-muted); margin-bottom: var(--space-xs); }
.hint { font-size: var(--text-sm); color: var(--color-muted); margin-top: var(--space-xs); line-height: 1.45; }

.inp:hover { border-color: var(--color-rule-strong); }

.inp:disabled { background: var(--color-paper-3); color: var(--color-muted); cursor: not-allowed; }
textarea.inp { min-height: 92px; resize: vertical; line-height: 1.45; }
.inp.mono { font-family: var(--font-outlier); font-size: var(--text-sm); }
input[type="range"] { accent-color: var(--color-accent); width: 100%; min-height: 32px; }
.row { display: flex; gap: var(--space-xs); align-items: center; }
.row.wrap { flex-wrap: wrap; }
.row > .grow { flex: 1; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-xs); }
.chip { min-height: 36px; padding: 0 var(--space-sm); border-radius: var(--radius-pill); font-size: var(--text-sm); font-weight: 500; color: var(--color-ink-2); display: inline-flex; align-items: center; gap: var(--space-xs); box-shadow: inset 0 0 0 var(--rule-hair) var(--color-rule); transition: background-color var(--dur-short) var(--ease-out); }
.chip:hover { background: var(--color-paper-3); }

.type:hover { border-color: var(--color-rule-strong); }
.type svg { width: 20px; height: 20px; color: var(--color-muted); }
.type.on { border-color: var(--color-accent); }
.type.on svg { color: var(--color-accent); }
.lights { display: flex; flex-wrap: wrap; gap: var(--space-xs); }
.light { width: 40px; height: 40px; border-radius: var(--radius-pill); display: grid; place-items: center; background: var(--color-paper); box-shadow: inset 0 0 0 var(--rule-hair) var(--color-rule); }
.light::before { content: ""; width: 20px; height: 20px; border-radius: var(--radius-pill); background: var(--sw); }
.light.on { box-shadow: inset 0 0 0 2px var(--color-ink); }
.light.custom { position: relative; overflow: hidden; }
.light.custom::before { background: conic-gradient(var(--heat-2), var(--heat-3), var(--heat-4), var(--heat-5), var(--heat-6), var(--heat-2)); }
.light.custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.light.auto::before { background: transparent; box-shadow: inset 0 0 0 2px var(--color-muted); }
.seg { display: inline-flex; padding: var(--space-3xs); border-radius: var(--radius-pill); background: var(--color-paper); border: var(--rule-hair) solid var(--color-rule); gap: var(--space-3xs); flex-wrap: wrap; }
.seg button { min-height: 36px; padding: 0 var(--space-sm); border-radius: var(--radius-pill); font-size: var(--text-sm); font-weight: 500; color: var(--color-muted); }
.seg button:hover { color: var(--color-ink); }

.icongrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: var(--space-2xs); max-height: 264px; overflow-y: auto; padding: var(--space-3xs); margin-top: var(--space-xs); }
.icongrid button { height: 48px; border-radius: 12px; display: grid; place-items: center; color: var(--color-ink-2); }
.icongrid button:hover { background: var(--color-paper-3); }

.preview { display: flex; justify-content: center; padding: var(--space-xs) 0 var(--space-lg); }

.step-head { display: flex; align-items: center; gap: var(--space-2xs); margin-bottom: var(--space-sm); }
.step-head .n { font-family: var(--font-display); font-size: var(--text-lg); width: 28px; text-align: center; color: var(--color-muted); }
.step-head select { flex: 1; }
.step .round { width: 36px; height: 36px; box-shadow: none; }
.step .round svg { width: 18px; height: 18px; }
.sub-box { padding: var(--space-sm); border-radius: var(--radius-well); border: var(--rule-hair) solid var(--color-rule); margin-top: var(--space-xs); }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); min-height: 52px; }
.toggle-row + .toggle-row { border-top: var(--rule-hair) solid var(--color-rule); }
.toggle-row .t { font-weight: 500; }

.switch { position: relative; width: 48px; height: 28px; flex: 0 0 auto; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: var(--radius-pill); background: var(--color-paper-4); pointer-events: none; transition: background-color var(--dur-short) var(--ease-out); }

.list { display: flex; flex-direction: column; }

.li .round { width: 40px; height: 40px; box-shadow: none; }

.li .name { border: 0; background: transparent; min-height: 44px; padding: 0; outline: none; }
.li .name:focus-visible { outline: 2px solid var(--color-focus); }
.applist { max-height: 50vh; overflow-y: auto; display: flex; flex-direction: column; margin-top: var(--space-xs); }
.applist button { display: flex; align-items: center; gap: var(--space-sm); text-align: left; padding: var(--space-xs) var(--space-sm); border-radius: 12px; min-height: 44px; }

<div id="app" class="hidden">
  <header class="bar">
    <button class="round hidden" id="backBtn" aria-label="Back"></button>

      method, signal: ctl.signal, cache: 'no-store',
      headers: { 'X-Deck': '1', 'X-Deck-Token': S.token, 'Content-Type': 'application/json' },
      body: body === undefined ? undefined : (typeof body === 'string' ? body : JSON.stringify(body))

}

async function boot() {
  wireStatic();
  $('#pairMark').innerHTML = MARK; $('#loadMark').innerHTML = MARK;
  const params = new URLSearchParams(location.search);
  const qpin = params.get('pin');
  if (qpin) history.replaceState(null, '', location.pathname + location.hash);
  let hello;
  try { hello = await api('/api/hello'); }
  catch (e) { $('#loadText').textContent = 'Can’t reach your PC. Check that PocketDeck is running there and you are on the same Wi-Fi.'; setTimeout(boot, 4000); return; }
  S.local = hello.local; S.pc = hello.pc; S.paused = hello.paused;
  if (!hello.paired && qpin) { if (await tryPair(qpin)) hello.paired = true; }
  if (!hello.paired) { showPair(); return; }
  await loadProfile();
  startDeck();
  if (S.local && (location.hash === '#connect')) openConnect();
}

async function loadProfile() {
  try {
    const r = await api('/api/profile');
    S.rev = r.rev;
    S.profile = r.profile;
  } catch (e) { S.profile = LS.get('pd.profile', null); }
  if (!S.profile || !Array.isArray(S.profile.pages) || !S.profile.pages.length) { S.profile = defaultProfile(); save(); }
  S.profile.settings = Object.assign({}, DEFAULT_SETTINGS, S.profile.settings || {});
  migrate(S.profile);
  LS.set('pd.profile', S.profile);
  if (!page(S.pageId)) { S.pageId = LS.get('pd.page', null); if (!page(S.pageId) || page(S.pageId).folder) S.pageId = topPages()[0] && topPages()[0].id; S.stack = []; }
}

function migrate(p) {
  if (p.settings.oled) { p.settings.theme = 'carbon'; delete p.settings.oled; }
  const fix = o => { if (o && o.color && /^#/.test(o.color) && OLD_HEX[o.color.toLowerCase()]) o.color = 'k:' + OLD_HEX[o.color.toLowerCase()]; };
  p.pages.forEach(pg => (pg.keys || []).forEach(k => { if (k) { fix(k); fix(k.alt); } }));
}

function movePage(p, dir) {

  document.body.append(a); a.click(); a.remove();
  if (navigator.clipboard && isSecureContext) navigator.clipboard.writeText(data).catch(() => {});
  toast('Backup downloaded');
}

  openSheet('Import backup', h('div', {}, ta, h('div', { class: 'row', style: 'margin-top:10px' }, h('button', { class: 'pill ghost', onclick: () => file.click() }, I('file'), 'Choose file'), file)), {

}

/* ============================================================ connect (PC) */
async function openConnect() {

  let info;
  try { info = await api('/api/connect'); } catch (e) { body.innerHTML = ''; body.append(h('p', {}, 'Could not load: ' + e.message)); return; }
  body.innerHTML = '';
  const url = info.urls[0];
  if (!url) { body.append(h('div', { class: 'notice bad' }, I('wifi-off'), h('span', { class: 'grow' }, 'This PC is not on a network yet. Join your Wi-Fi first.'))); return; }
  const qr = qrcode(0, 'M'); qr.addData(url + '?pin=' + info.pin); qr.make();
  body.className = 'connect';
  body.append(
    h('div', { class: 'top' },
      h('div', { class: 'qrbox', html: qr.createSvgTag({ cellSize: 6, margin: 0, scalable: true }), role: 'img', 'aria-label': 'QR code that opens PocketDeck on your phone' }),
      h('div', {},
        h('ol', { class: 'steps-list' }, h('li', {}, 'Join the same Wi-Fi as this PC.'), h('li', {}, 'Point the phone camera at the code.'), h('li', {}, 'Or open the address below and type the PIN.')))),
    h('div', {}, h('span', { class: 'lbl' }, 'PIN'), h('div', { class: 'bigpin figure' }, info.pin)),
    h('div', {}, h('span', { class: 'lbl' }, info.urls.length > 1 ? 'Addresses' : 'Address'), ...info.urls.map(u => h('div', { class: 'url' }, u))),
    info.devices.length ? h('div', {}, h('span', { class: 'lbl' }, 'Paired phones'),
      h('div', { class: 'list' }, info.devices.map(d => h('div', { class: 'li' }, I('smartphone'), h('span', { class: 'grow' }, d.name), h('span', { class: 'hint', style: 'margin:0' }, ago(d.seen))))),
      h('button', { class: 'pill danger small', style: 'margin-top:8px', onclick: async () => { if (await confirmDlg('Disconnect every phone and make a new PIN?', 'Unpair all')) { await api('/api/unpair-all', { method: 'POST', body: {} }); openConnect(); } } }, 'Unpair all and make a new PIN')) : null,
    h('details', {}, h('summary', {}, 'Phone can’t connect?'),
      h('ul', { class: 'steps-list' },
        h('li', {}, 'Both must be on the same Wi-Fi, not a guest network.'),
        h('li', {}, 'In Windows, set this Wi-Fi to Private: Settings, Network, Wi-Fi, your network.'),
        h('li', {}, 'If Windows asked about the firewall, choose Allow, or run Install.bat again.'),
        h('li', {}, 'Try the other address if two are listed.'))));

function ago(iso) {
  if (!iso) return ''; const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 90) return 'now'; if (s < 3600) return Math.round(s / 60) + 'm ago'; if (s < 86400) return Math.round(s / 3600) + 'h ago'; return Math.round(s / 86400) + 'd ago';
}
function openPhoneTips() {
  const steps = isIOS
    ? ['Tap the Share button in Safari.', 'Tap “Add to Home Screen”, then Add.', 'Open PocketDeck from the home screen icon (full screen).', 'Keep the screen on: Settings > Display & Brightness > Auto-Lock > Never (for a dedicated deck phone).', 'Lock it to this app: Settings > Accessibility > Guided Access.']
    : ['Tap the ⋮ menu in Chrome.', 'Tap “Add to Home screen”.', 'Open PocketDeck from the home screen icon.', 'Keep the screen on: Settings > Display > Screen timeout (max), or Developer options > Stay awake while charging.', 'Optional: Settings > Security > App pinning to lock it to this app.'];
  openSheet('Make it feel like an app', h('div', {}, h('ol', { class: 'steps-list' }, steps.map(s => h('li', {}, s))),
    h('p', { class: 'hint', style: 'margin-top:16px' }, 'A phone stand and a charger turn it into a desk deck that stays put.')), { center: true, foot: [h('button', { class: 'pill primary block', onclick: closeSheet }, 'Got it')] });

/* ============================================================ haptics + keep awake */
function haptic(p = 10) {
  if (!S.profile || !settings().haptics) return;
  if (navigator.vibrate) { try { navigator.vibrate(p); return; } catch {} }
  if (isIOS) { try { $('#hapticLabel').click(); } catch {} }
}
let wakeLock = null, nosleepOn = false;
async function setupAwake() {
  if (!S.profile) return;
  const want = settings().awake && !S.local;
  if (!want) { try { wakeLock && wakeLock.release(); } catch {} wakeLock = null; $('#nosleep').pause(); nosleepOn = false; return; }
  if ('wakeLock' in navigator && isSecureContext) {
    try { wakeLock = await navigator.wakeLock.request('screen'); return; } catch {}
  }
  // Fallback for plain http on the LAN: a tiny silent looping video keeps phones awake.
  const v = $('#nosleep');
  if (!v.src) v.src = NOSLEEP_MP4;
  const start = () => { v.play().then(() => { nosleepOn = true; }).catch(() => {}); };
  start();
  if (!nosleepOn) document.addEventListener('pointerdown', start, { once: true });
}

  window.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetOpen()) closeSheet(); });

}

<script>
