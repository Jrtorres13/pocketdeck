/* Hallmark · pre-emit critique: P4 H3 E4 S4 R4 V3 · weakest: V, the user picks key colours outside the ramp, so the ramp lives in the defaults and live states while custom colours stay confined to each key's light */
/* Hallmark · waive 28b · the keep-awake video is hidden, never seen and never the LCP

.type.on svg { color: var(--color-accent); }

.light { width: 40px; height: 40px; border-radius: var(--radius-pill); display: grid; place-items: center; background: var(--color-paper); box-shadow: inset 0 0 0 var(--rule-hair) var(--color-rule); }
.light::before { content: ""; width: 20px; height: 20px; border-radius: var(--radius-pill); background: var(--sw); }
.light.on { box-shadow: inset 0 0 0 2px var(--color-ink); }
.light.custom { position: relative; overflow: hidden; }
.light.custom::before { background: conic-gradient(var(--key-ember), var(--key-amber), var(--key-sage), var(--key-sky), var(--key-iris), var(--key-rose), var(--key-ember)); }
.light.custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.light.auto::before { background: transparent; box-shadow: inset 0 0 0 2px var(--color-muted); }
.seg { display: inline-flex; padding: var(--space-3xs); border-radius: var(--radius-pill); background: var(--color-paper); border: var(--rule-hair) solid var(--color-rule); gap: var(--space-3xs); flex-wrap: wrap; }
.seg button { min-height: 36px; padding: 0 var(--space-sm); border-radius: var(--radius-pill); font-size: var(--text-sm); font-weight: 500; color: var(--color-muted); }
.seg button:hover { color: var(--color-ink); }
.seg button.on { background: var(--color-paper-3); color: var(--color-ink); box-shadow: inset 0 0 0 var(--rule-hair) var(--color-rule); }
.icongrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: var(--space-2xs); max-height: 264px; overflow-y: auto; padding: var(--space-3xs); margin-top: var(--space-xs); }
.icongrid button { height: 48px; border-radius: 12px; display: grid; place-items: center; color: var(--color-ink-2); }
.icongrid button:hover { background: var(--color-paper-3); }
.icongrid button.on { background: var(--color-ink); color: var(--color-paper); }
.icongrid button svg { width: 22px; height: 22px; }
.icongrid .more { grid-column: 1 / -1; height: 40px; font-size: var(--text-sm); color: var(--color-muted); }
.preview { display: flex; justify-content: center; padding: var(--space-xs) 0 var(--space-lg); }
.steps { display: flex; flex-direction: column; gap: var(--space-xs); }
.step { padding: var(--space-sm); border-radius: var(--radius-well); background: var(--color-paper); border: var(--rule-hair) solid var(--color-rule); }
.step-head { display: flex; align-items: center; gap: var(--space-2xs); margin-bottom: var(--space-sm); }
.step-head .n { font-family: var(--font-display); font-size: var(--text-lg); width: 28px; text-align: center; color: var(--color-muted); }
.step-head select { flex: 1; }
.step .round { width: 36px; height: 36px; box-shadow: none; }
.step .round svg { width: 18px; height: 18px; }
.sub-box { padding: var(--space-sm); border-radius: var(--radius-well); border: var(--rule-hair) solid var(--color-rule); margin-top: var(--space-xs); }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); min-height: 52px; }
.toggle-row + .toggle-row { border-top: var(--rule-hair) solid var(--color-rule); }
.toggle-row .t { font-weight: 500; }
.toggle-row .d { font-size: var(--text-sm); color: var(--color-muted); }
.switch { position: relative; width: 48px; height: 28px; flex: 0 0 auto; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: var(--radius-pill); background: var(--color-paper-4); pointer-events: none; transition: background-color var(--dur-short) var(--ease-out); }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--color-ink); transition: transform var(--dur-short) var(--ease-out); }
.switch input:checked + span { background: var(--color-accent); }
.switch input:checked + span::after { transform: translateX(20px); background: var(--color-accent-ink); }
.switch input:focus-visible + span { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: var(--space-xs); min-height: 52px; border-bottom: var(--rule-hair) solid var(--color-rule); }
.li:last-child { border-bottom: 0; }
.li > svg, .li > span > svg { width: 20px; height: 20px; flex: 0 0 auto; color: var(--color-muted); }
.li .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .round { width: 40px; height: 40px; box-shadow: none; }
.li .round svg { width: 18px; height: 18px; }
.li .name { border: 0; background: transparent; min-height: 44px; padding: 0; outline: none; }
.li .name:focus-visible { outline: 2px solid var(--color-focus); }
.applist { max-height: 50vh; overflow-y: auto; display: flex; flex-direction: column; margin-top: var(--space-xs); }
.applist button { display: flex; align-items: center; gap: var(--space-sm); text-align: left; padding: var(--space-xs) var(--space-sm); border-radius: 12px; min-height: 44px; }
.applist button:hover { background: var(--color-paper-3); }
.kbd { font-family: var(--font-outlier); font-size: var(--text-sm); padding: var(--space-3xs) var(--space-xs); border-radius: 8px; background: var(--color-paper-3); }
.picker { position: sticky; top: calc(var(--space-xs) * -1); z-index: var(--z-raised); background: var(--color-paper-2); padding: var(--space-xs) 0 var(--space-sm); border-bottom: var(--rule-hair) solid var(--color-rule); margin-bottom: var(--space-md); }

/* ---------- pair + connect ---------- */
.screen { position: fixed; inset: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-lg); padding: calc(var(--safe-t) + var(--space-lg)) var(--space-lg) calc(var(--safe-b) + var(--space-lg)); text-align: center; }
.mark { width: 56px; height: 56px; color: var(--color-ink); }
.screen h1 { font-size: var(--text-3xl); max-width: 14ch; }
.screen p { color: var(--color-muted); max-width: 34ch; }
.pinboxes { display: flex; gap: var(--space-xs); }
.pinboxes div { width: 46px; height: 60px; border-radius: 14px; background: var(--color-paper-2); border: var(--rule-hair) solid var(--color-rule); display: grid; place-items: center; font-family: var(--font-display); font-size: var(--text-3xl); line-height: 1; }
.pinboxes div.f { border-color: var(--color-focus); }
.pinboxes.bad { animation: shake var(--dur-short) var(--ease-out); }
.numpad { display: grid; grid-template-columns: repeat(3, 76px); gap: var(--space-sm); }
.numpad button { height: 64px; border-radius: 20px; font-family: var(--font-display); font-size: var(--text-2xl); background: linear-gradient(to bottom, var(--color-paper-3), var(--color-paper-2)); border: var(--rule-hair) solid var(--color-rule); box-shadow: inset 0 1px 0 var(--key-hi), 0 3px 0 var(--key-lo); transition: transform var(--dur-micro) var(--ease-out); }
.numpad button:active { transform: translateY(2px); }
.numpad svg { width: 22px; height: 22px; margin: auto; }
.err-text { color: var(--color-error); min-height: 22px; font-size: var(--text-sm); }
.connect { display: grid; gap: var(--space-lg); }
.connect .top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-lg); align-items: center; }
@media (max-width: 520px) { .connect .top { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; } }
.qrbox { background: var(--qr-light); color: var(--qr-dark); border-radius: 20px; padding: var(--space-sm); width: 204px; }
.qrbox svg { width: 180px; height: 180px; }
.qrbox svg rect, .qrbox svg path { fill: currentColor; }
.bigpin { font-size: var(--text-4xl); line-height: 1; letter-spacing: 0.04em; }
.url { font-family: var(--font-outlier); font-size: var(--text-sm); color: var(--color-ink-2); overflow-wrap: anywhere; }
.steps-list { margin: 0; padding-left: 1.2em; color: var(--color-ink-2); line-height: 1.6; text-align: left; }
.steps-list li + li { margin-top: var(--space-2xs); }
details summary { cursor: pointer; color: var(--color-muted); min-height: 44px; display: flex; align-items: center; }
.toast { pointer-events: none; position: fixed; z-index: var(--z-toast); left: 50%; bottom: calc(var(--safe-b) + var(--space-xl)); transform: translate(-50%, 12px); opacity: 0; padding: var(--space-sm) var(--space-md); border-radius: var(--radius-pill); background: var(--color-ink); color: var(--color-paper); font-size: var(--text-sm); font-weight: 500; max-width: 90vw; transition: opacity var(--dur-short) var(--ease-out), transform var(--dur-short) var(--ease-out); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { background: var(--color-error); color: var(--color-accent-ink); }
.dialog-actions { display: flex; gap: var(--space-xs); justify-content: flex-end; margin-top: var(--space-lg); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }
</style>
</head>
<body>
<noscript><p style="padding:24px">PocketDeck needs JavaScript turned on.</p></noscript>
<div id="app" class="hidden">
  <header class="bar">
    <button class="round hidden" id="backBtn" aria-label="Back"></button>
    <div class="where"><h1 id="pageTitle">PocketDeck</h1><p class="status" id="status">Connecting</p></div>
    <button class="pill ghost hidden" id="connectBtn"></button>
    <button class="round" id="editBtn" aria-label="Edit keys"></button>
    <button class="round" id="settingsBtn" aria-label="Settings"></button>
  </header>
  <div id="banners"></div>
  <div class="editbar hidden" id="editbar"><span>Tap a key to change it. Drag to move it.</span><button class="pill primary small" id="doneBtn">Done</button></div>
  <main id="stage"><div id="grid"></div></main>
  <nav class="tabs" id="pages" aria-label="Pages"></nav>
</div>

<div id="pair" class="screen hidden">
  <div class="mark" id="pairMark"></div>
  <h1>Pair with your PC</h1>
  <p>Type the PIN shown on your PC. Open PocketDeck there and choose Connect a phone.</p>
  <div class="pinboxes" id="pinboxes" aria-live="polite"></div>
  <div class="err-text" id="pinErr" role="alert"></div>
  <div class="numpad" id="numpad"></div>
</div>

<div id="loading" class="screen"><div class="mark" id="loadMark"></div><p id="loadText">Looking for your PC</p></div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <div class="grab"></div>
  <div class="sh-head"><h2 id="shTitle"></h2><button class="round" id="shClose" aria-label="Close"></button></div>
  <div class="sh-body" id="shBody"></div>
  <div class="sh-foot hidden" id="shFoot"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<label id="hapticLabel" class="hidden"><input type="checkbox" switch id="hapticSwitch"></label>
<video id="nosleep" playsinline muted loop class="hidden"></video>
