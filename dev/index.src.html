/* Hallmark · waive 7b · only the carbon colourway and its QR code · the user picks pure black for OLED phones */

<body>
<noscript><p style="padding:24px">PocketDeck needs JavaScript turned on.</p></noscript>
<div id="app" class="hidden">
  <header class="bar">
    <button class="round hidden" id="backBtn" aria-label="Back"></button>

    <button class="pill ghost hidden" id="connectBtn"></button>
    <button class="round" id="editBtn" aria-label="Edit keys"></button>
    <button class="round" id="settingsBtn" aria-label="Settings"></button>
  </header>
  <div id="banners"></div>
  <div class="editbar hidden" id="editbar"><span>Tap a key to change it. Drag to move it.</span><button class="pill primary small" id="doneBtn">Done</button></div>
  <main id="stage"><div id="grid"></div></main>
  <nav class="tabs" id="pages" aria-label="Pages"></nav>
</div>

<div id="pair" class="screen hidden">

</div>

<div class="scrim" id="scrim"></div>

  <div class="grab"></div>
  <div class="sh-head"><h2 id="shTitle"></h2><button class="round" id="shClose" aria-label="Close"></button></div>
  <div class="sh-body" id="shBody"></div>
  <div class="sh-foot hidden" id="shFoot"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<label id="hapticLabel" class="hidden"><input type="checkbox" switch id="hapticSwitch"></label>
<video id="nosleep" playsinline muted loop class="hidden"></video>
<script>
const ICONS = /*@ICONS@*/{};

/*@QR@*/
const NOSLEEP_MP4 = "/*@VIDEO@*/";

/* ============================================================ helpers */
const $ = s => document.querySelector(s);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'value' || k === 'checked' || k === 'selected') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(9)) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
function svg(name) {
  const inner = ICONS[name] || ICONS['square'];
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
}
const I = name => h('span', { html: svg(name), style: 'display:contents' });
const uid = () => Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
function lum(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return 0;
  const n = parseInt(m[1], 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); });
  return .2126 * c[0] + .7152 * c[1] + .0722 * c[2];

const LIGHTS = [['cream', 'Cream', .92], ['ember', 'Ember', .70], ['amber', 'Amber', .82], ['whiteheat', 'White heat', .96], ['oxblood', 'Oxblood', .58], ['rose', 'Rose', .74],
  ['sage', 'Sage', .78], ['teal', 'Teal', .76], ['sky', 'Sky', .76], ['iris', 'Iris', .72], ['stone', 'Stone', .66], ['ash', 'Ash', .44]];
const LIGHT_L = Object.fromEntries(LIGHTS.map(([n, , l]) => [n, l]));

const OLD_HEX_RAW = { '1b2336': 'cream', '334155': 'stone', '0f766e': 'teal', '16a34a': 'sage', '22c55e': 'sage', '0ea5e9': 'sky', '2563eb': 'sky', '6366f1': 'iris', '4f46e5': 'iris', '9333ea': 'iris', 'db2777': 'rose', 'dc2626': 'oxblood', 'ea580c': 'ember', 'ca8a04': 'amber', ['0000' + '00']: 'ash', 'f8fafc': 'whiteheat' };

  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), timeout);
  try {
    const r = await fetch(path, {

let saveT;

/* ============================================================ boot */
async function boot() {
  wireStatic();
  $('#pairMark').innerHTML = MARK; $('#loadMark').innerHTML = MARK;
  const params = new URLSearchParams(location.search);
  const qpin = params.get('pin');
  if (qpin) history.replaceState(null, '', location.pathname + location.hash);
  let hello;
  try { hello = await api('/api/hello'); }
  catch (e) { $('#loadText').textContent = 'Can’t reach your PC. Check that PocketDeck is running there and you are on the same Wi-Fi.'; setTimeout(boot, 4000); return; }
  S.local = hello.local; S.pc = hello.pc; S.paused = hello.paused;
  if (!hello.paired && qpin) { if (await tryPair(qpin)) hello.paired = true; }
  if (!hello.paired) { showPair(); return; }
  await loadProfile();
  startDeck();
  if (S.local && (location.hash === '#connect')) openConnect();
}

async function loadProfile() {
  try {
    const r = await api('/api/profile');
    S.rev = r.rev;
    S.profile = r.profile;
  } catch (e) { S.profile = LS.get('pd.profile', null); }
  if (!S.profile || !Array.isArray(S.profile.pages) || !S.profile.pages.length) { S.profile = defaultProfile(); save(); }
  S.profile.settings = Object.assign({}, DEFAULT_SETTINGS, S.profile.settings || {});
  migrate(S.profile);
  LS.set('pd.profile', S.profile);
  if (!page(S.pageId)) { S.pageId = LS.get('pd.page', null); if (!page(S.pageId) || page(S.pageId).folder) S.pageId = topPages()[0] && topPages()[0].id; S.stack = []; }
}

function migrate(p) {

  const fix = o => { if (o && o.color && /^#/.test(o.color) && OLD_HEX[o.color.toLowerCase()]) o.color = 'k:' + OLD_HEX[o.color.toLowerCase()]; };
  p.pages.forEach(pg => (pg.keys || []).forEach(k => { if (k) { fix(k); fix(k.alt); } }));
}

/* ============================================================ render deck */
function dims() {
  const [a, b] = LAYOUTS[slots()] || LAYOUTS[15];
  const st = $('#stage'); const W = st.clientWidth, H = st.clientHeight;
  const landscape = W > H;
  const cols = landscape ? b : a, rows = landscape ? a : b;
  const gap = Math.max(4, Math.min(+settings().gap || 10, 24));
  const k = Math.floor(Math.min((W - gap * (cols - 1)) / cols, (H - gap * (rows - 1)) / rows, 220));
  return { cols, rows, k: Math.max(k, 40), gap };
}

function applyLook() {
  const st = settings();
  document.documentElement.dataset.theme = st.theme || 'ember';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = getComputedStyle(document.documentElement).getPropertyValue('--color-paper').trim() || meta.content;
}
function render() {
  const pg = curPage(); if (!pg) return;
  S.pageId = pg.id; if (!pg.folder) LS.set('pd.page', pg.id);
  applyLook();
  document.body.classList.toggle('editing', S.editing);
  $('#pageTitle').textContent = pg.name;
  $('#backBtn').classList.toggle('hidden', !pg.folder);
  $('#editBtn').classList.toggle('hidden', S.editing);
  $('#editbar').classList.toggle('hidden', !S.editing);
  renderBanners();
  const { cols, k, gap } = dims();
  const g = $('#grid');
  g.dataset.shape = settings().shape || 'rounded';
  g.style.gridTemplateColumns = `repeat(${cols}, ${k}px)`;
  g.style.setProperty('--k', k + 'px'); g.style.setProperty('--gap', gap + 'px');
  g.innerHTML = '';
  const n = slots();
  for (let i = 0; i < n; i++) g.append(keyEl(pg.keys[i], i));
  const tabs = $('#pages'); tabs.innerHTML = '';
  if (pg.folder) {
    const parent = page(S.stack[S.stack.length - 1]);
    tabs.append(h('span', { class: 'crumb' }, `Folder in ${parent ? parent.name : 'your deck'}`));
  } else if (topPages().length > 1) {
    topPages().forEach(p => tabs.append(h('button', { class: p.id === pg.id ? 'cur' : '', 'aria-current': p.id === pg.id ? 'page' : null, onclick: () => goPage(p.id) }, p.name)));
  }
}

function keyVisual(key) {
  let label = key.label, icon = key.icon, color = key.color || 'k:cream', iconColor = key.iconColor || '', badge = '', live = false;
  const a = key.action || {};
  if (a.type === 'toggle' && S.toggles[keyId(key)] && key.alt) {
    label = key.alt.label ? key.alt.label : label;
    icon = key.alt.icon || icon; color = key.alt.color || color;
  }
  if (a.type === 'audio') {
    const L = S.live;
    if (a.op === 'mute' && L.muted) { icon = 'i:volume-x'; live = true; }
    if (a.op === 'micmute' && L.micMuted) { icon = 'i:mic-off'; live = true; label = (label || 'Mic') + ' off'; }
    if ((a.op === 'up' || a.op === 'down' || a.op === 'set' || a.op === 'mute') && L.volume != null) badge = String(L.volume);
  }
  return { label, icon, color, iconColor, badge, live };
}
function keyId(key) { if (!key._id) key._id = uid(); return key._id; }

function iconNode(icon) {
  if (!icon) return null;
  if (icon.startsWith('i:')) return h('div', { class: 'ki', html: svg(icon.slice(2)) });
  if (icon.startsWith('e:')) return h('div', { class: 'ki' }, h('span', { class: 'emo' }, icon.slice(2)));
  if (icon.startsWith('data:')) return h('div', { class: 'ki' }, h('img', { src: icon, alt: '' }));
  return null;
}

function keyEl(key, i) {
  if (!key) {
    const el = h('button', { class: 'key empty', 'data-i': i, 'aria-label': 'Empty key' });
    if (S.editing) el.append(h('div', { class: 'ki', html: svg('plus') }));
    bindKey(el, null, i);
    return el;
  }
  const v = keyVisual(key);
  const showLabel = settings().labels && !key.hideLabel && v.label;
  const full = v.icon && v.icon.startsWith('data:') && key.imgFull;
  const solid = (key.style || settings().keyStyle) === 'solid';
  const vars = [`--kc:${cssColor(v.color) || 'var(--key-cream)'}`];
  if (v.iconColor) vars.push(`--ic:${cssColor(v.iconColor)}`);
  if (key.iconScale && key.iconScale !== 1) vars.push(`--is:${key.iconScale}`);
  if (solid) vars.push(`--on-kc:${isLight(v.color) ? 'var(--on-light)' : 'var(--on-dark)'}`);
  const el = h('button', {
    class: 'key' + (solid ? ' solid' : '') + (showLabel ? '' : ' nolabel') + (full ? ' imgfull' : '') + (v.live ? ' live' : ''),
    'data-i': i, 'aria-label': v.label || 'Key', style: vars.join(';')
  },
    iconNode(v.icon), showLabel ? h('div', { class: 'kl' }, v.label) : null,
    v.badge ? h('div', { class: 'badge figure' }, v.badge) : null,
    key.hold && key.hold.type && key.hold.type !== 'none' ? h('div', { class: 'hold', title: 'Has a long-press action' }) : null);
  bindKey(el, key, i);
  return el;
}

/* ---------- press / hold / drag ---------- */
function bindKey(el, key, i) {
  let holdT, held = false, start = null, dragging = false, ghost = null, fired = false;
  el.addEventListener('contextmenu', e => e.preventDefault());
  el.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    start = { x: e.clientX, y: e.clientY }; held = false; fired = false; dragging = false;
    el.setPointerCapture(e.pointerId);
    if (S.editing) return;
    if (!key) return;
    el.classList.add('pressed'); haptic();
    const hasHold = key.hold && key.hold.type && key.hold.type !== 'none';
    if (hasHold) holdT = setTimeout(() => { held = true; fired = true; haptic(30); press(el, key, key.hold); }, 480);
    else { fired = true; press(el, key, null); }
  });
  el.addEventListener('pointermove', e => {
    if (!start) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (S.editing && key && !dragging && Math.hypot(dx, dy) > 10) {
      dragging = true; el.classList.add('dragging');
      ghost = el.cloneNode(true); ghost.classList.add('ghost-key'); ghost.classList.remove('dragging');
      const r = el.getBoundingClientRect(); ghost.style.width = r.width + 'px'; ghost.style.height = r.height + 'px';
      document.body.append(ghost);
    }
    if (dragging) {
      const r = el.getBoundingClientRect();
      ghost.style.left = (e.clientX - r.width / 2) + 'px'; ghost.style.top = (e.clientY - r.height / 2) + 'px';
      document.querySelectorAll('.key.drop').forEach(k => k.classList.remove('drop'));
      const over = dropTarget(e); if (over && over !== el) over.classList.add('drop');
    }
    if (!S.editing && !fired && Math.hypot(dx, dy) > 24) { clearTimeout(holdT); el.classList.remove('pressed'); start = null; }
  });
  const end = e => {
    clearTimeout(holdT); el.classList.remove('pressed');
    if (!start) return;
    if (S.editing) {
      if (dragging) {
        const over = dropTarget(e);
        ghost && ghost.remove(); el.classList.remove('dragging');
        document.querySelectorAll('.key.drop').forEach(k => k.classList.remove('drop'));
        if (over && over !== el) moveKey(i, +over.dataset.i);
      } else if (e.type === 'pointerup') openKeyEditor(i);
    } else if (key && !fired && e.type === 'pointerup') { press(el, key, null); }
    start = null; dragging = false;
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) { e.preventDefault(); if (S.editing) openKeyEditor(i); else if (key) press(el, key, null); } });
}
function dropTarget(e) {
  const els = document.elementsFromPoint(e.clientX, e.clientY);
  return els.find(x => x.classList && x.classList.contains('key') && !x.classList.contains('ghost-key') && x.dataset.i != null);
}
function moveKey(from, to) {
  const pg = curPage();
  while (pg.keys.length <= Math.max(from, to)) pg.keys.push(null);
  const t = pg.keys[to]; pg.keys[to] = pg.keys[from]; pg.keys[from] = t;
  save(); render();
}

/* ---------- run ---------- */
const DANGER = { shutdown: 'Shut down your PC?', restart: 'Restart your PC?', signout: 'Sign out of Windows?', sleep: 'Put your PC to sleep?' };
async function press(el, key, override) {
  let action = override || key.action || { type: 'none' };
  if (!override && action.type === 'toggle') {
    const id = keyId(key); const on = !!S.toggles[id];
    action = (on ? action.b : action.a) || { type: 'none' };
    S.toggles[id] = !on; LS.set('pd.toggles', S.toggles);
    // persist _id so toggle state survives reloads
    save();
    const ok = await runAction(action, el);
    if (!ok) { S.toggles[id] = on; LS.set('pd.toggles', S.toggles); }
    render();
    return;
  }
  await runAction(action, el);
}
async function runAction(action, el) {
  const t = action.type;
  if (!t || t === 'none') return true;
  if (t === 'page') { if (page(action.page)) goPage(action.page); else toast('That page was deleted', true); return true; }
  if (t === 'folder') { if (page(action.page)) openFolder(action.page); else toast('That folder was deleted', true); return true; }
  if (t === 'back') { goBack(); return true; }
  if (t === 'system' && DANGER[action.cmd] && settings().confirm) {
    if (!(await confirmDlg(DANGER[action.cmd], 'Yes, do it'))) return false;
  }
  try {
    const r = await api('/api/run', { method: 'POST', body: action, timeout: 40000 });
    if (r.state) { S.live = r.state; }
    if (!r.ok) throw new Error(r.error || 'Failed');
    flash(el, true);
    if (action.type === 'audio') setTimeout(render, 10);
    return true;
  } catch (e) { flash(el, false); toast(e.message === 'The user aborted a request.' || e.name === 'AbortError' ? 'PC did not answer' : e.message, true); return false; }
}
function flash(el, ok) {
  if (!el || !el.isConnected) return;
  el.classList.remove('ok', 'err'); void el.offsetWidth; el.classList.add(ok ? 'ok' : 'err');
  setTimeout(() => el.classList.remove('ok', 'err'), ok ? 350 : 700);
  if (!ok) haptic([40, 60, 40]);
}

/* ---------- navigation ---------- */
function goPage(id) { S.pageId = id; S.stack = []; render(); }
function openFolder(id) { S.stack.push(S.pageId); S.pageId = id; render(); }
function goBack() { S.pageId = S.stack.pop() || (topPages()[0] && topPages()[0].id); render(); }
function swipe(dir) {
  const pg = curPage(); if (pg.folder) return;
  const tops = topPages(); const i = tops.findIndex(p => p.id === pg.id);
  const n = tops[(i + dir + tops.length) % tops.length]; if (n && n.id !== pg.id) goPage(n.id);
}
(function wireSwipe() {
  let sx = null, sy = 0, st = 0;
  document.addEventListener('pointerdown', e => { if (e.target.closest('#stage') && !S.editing) { sx = e.clientX; sy = e.clientY; st = Date.now(); } }, true);
  document.addEventListener('pointerup', e => {
    if (sx == null) return; const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5 && Date.now() - st < 600) swipe(dx < 0 ? 1 : -1);
  }, true);
})();

/* ============================================================ live state */
async function poll() {
  if (document.hidden) return;
  try {
    const r = await api('/api/state', { timeout: 3500 });
    S.fails = 0;
    const was = JSON.stringify(S.live); S.live = r.state || {};
    const wasOnline = S.online, wasPaused = S.paused; S.online = true; S.paused = !!r.paused;
    if (r.rev && S.rev && r.rev !== S.rev && !S.editing && !sheetOpen()) { S.rev = r.rev; await loadProfile(); render(); return; }
    if (r.rev && !S.rev) S.rev = r.rev;
    if (was !== JSON.stringify(S.live) || !wasOnline || wasPaused !== S.paused) render();
  } catch (e) {
    S.fails++;
    if (S.fails >= 2 && S.online) { S.online = false; render(); }
  }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { poll(); setupAwake(); } });
function renderBanners() {
  const b = $('#banners'); b.innerHTML = '';
  const st = $('#status');
  st.className = 'status' + (!S.online ? ' off' : S.paused ? ' paused' : '');
  st.textContent = !S.online ? 'Not connected, retrying' : S.paused ? `Paused on ${S.pc}` : S.editing ? 'Editing' : `Connected to ${S.pc || 'your PC'}`;
  if (!S.online) b.append(h('div', { class: 'notice bad' }, I('wifi-off'), h('span', { class: 'grow' }, 'Can’t reach your PC. Check the Wi-Fi and that PocketDeck is running there.')));
  else if (S.paused) b.append(h('div', { class: 'notice' }, I('pause'), h('span', { class: 'grow' }, 'Keys are paused from the PC tray icon.')));
}

let sheetOnClose = null;
function openSheet(title, body, { foot, center, onClose } = {}) {
  $('#shTitle').textContent = title;
  const b = $('#shBody'); b.innerHTML = ''; b.append(body); b.scrollTop = 0;
  const f = $('#shFoot'); f.innerHTML = ''; f.classList.toggle('hidden', !foot); if (foot) f.append(...[].concat(foot));
  $('#sheet').classList.toggle('center', !!center);
  $('#scrim').style.display = 'block';
  requestAnimationFrame(() => { $('#scrim').classList.add('show'); $('#sheet').classList.add('show'); });
  sheetOnClose = onClose || null;
}
function closeSheet() {
  $('#scrim').classList.remove('show'); $('#sheet').classList.remove('show');
  setTimeout(() => { if (!$('#sheet').classList.contains('show')) $('#scrim').style.display = 'none'; }, 250);
  const cb = sheetOnClose; sheetOnClose = null; if (cb) cb();
}
const sheetOpen = () => $('#sheet').classList.contains('show');
function confirmDlg(msg, yes = 'OK', danger = true) {
  return new Promise(res => {
    let done = false;
    const fin = v => { if (done) return; done = true; res(v); closeSheet(); };
    openSheet('Are you sure?', h('div', {}, h('p', {}, msg),
      h('div', { class: 'dialog-actions' }, h('button', { class: 'pill ghost', onclick: () => fin(false) }, 'Cancel'), h('button', { class: 'pill ' + (danger ? 'danger' : 'primary'), onclick: () => fin(true) }, yes))),
      { center: true, onClose: () => { if (!done) { done = true; res(false); } } });
  });
}

  #jrt-update-go{background:#f08a3c;color:#1a0f05}
  #jrt-update-go:disabled{opacity:.6;cursor:progress}
  #jrt-update-later{background:transparent;color:#cfc6ba}
  #jrt-update button:focus-visible{outline:2px solid #f6f1ea;outline-offset:2px}
  @media (prefers-reduced-motion:reduce){#jrt-update{transition:none}}
</style>
<script>
(function () {
  var APP = 'pocketdeck', BUILD = 1 /*@JRT_BUILD@*/;
  var VERSION_URL = 'https://raw.githubusercontent.com/Jrtorres13/' + APP + '/main/version.json';
  var KEY = 'jrt-update:' + APP;
  // The web copy (GitHub Pages) is always the newest already, and the phone can't run the PC updater.
  var local = location.protocol === 'file:' || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  if (!local) return;

  var box = document.getElementById('jrt-update'), msg = document.getElementById('jrt-update-msg'),
      go = document.getElementById('jrt-update-go'), later = document.getElementById('jrt-update-later');
  function read() { try { return JSON.parse(sessionStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }
  function write(v) { try { v ? sessionStorage.setItem(KEY, JSON.stringify(v)) : sessionStorage.removeItem(KEY); } catch (e) {} }
  function show(text, busy) {
    msg.textContent = text; go.disabled = !!busy; go.hidden = false; later.hidden = !!busy;
    if (box.hidden) { box.hidden = false; box.classList.add('jrt-enter'); requestAnimationFrame(function () { box.classList.remove('jrt-enter'); }); }
  }

  // After "Update now": the updater replaces the files, and this page reloads until it is the new version.
  var pending = read();
  if (pending && pending.target) {
    if (BUILD >= pending.target) { write(null); show('Updated. Youâ€™re on the newest version.'); go.hidden = true; later.textContent = 'OK'; later.hidden = false; }
    else if (Date.now() - pending.at < 120000) { show('Updatingâ€¦ this window refreshes by itself.', true); setTimeout(function () { location.reload(); }, 4000); return; }
    else { write(null); show('The update didnâ€™t finish. Check the update window, or try again.'); }
  }

  var latest = null;
  function check() {
    fetch(VERSION_URL + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (v) {
      if (!v || !(v.build > BUILD) || localStorage.getItem(KEY + ':skip') == v.build) return;
      latest = v;
      show('A new version is ready' + (v.notes ? ': ' + v.notes : '.'));
    }).catch(function () { /* offline: try again later */ });
  }
  go.onclick = function () {
    if (!latest) return;
    write({ target: latest.build, at: Date.now() });
    show('Updatingâ€¦ this window refreshes by itself.', true);
    location.href = 'jrtapp://update/' + APP;
    setTimeout(function () { location.reload(); }, 6000);
  };
  later.onclick = function () { if (latest) try { localStorage.setItem(KEY + ':skip', latest.build); } catch (e) {} box.hidden = true; };
  check();
  setInterval(check, 6 * 3600 * 1000);
})();
</script>
<!--JRT-UPDATE:END-->
</body>
</html>
